spring.application.name=Jupasu
spring.profiles.active=dev

# Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:15432/jupasu}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:jupasu_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:jupasu_pass}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Redis Configuration
spring.data.redis.host=${SPRING_DATA_REDIS_HOST}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT}

# Email Configuration (Google SMTP - SSL 465)
spring.mail.host=smtp.gmail.com
spring.mail.port=465
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.jpa.properties.hibernate.default_batch_fetch_size=100
# JDBC 배치 INSERT/UPDATE (SEQUENCE 전략 엔티티에 적용, IDENTITY는 Hibernate가 배치를 끈다)
spring.jpa.properties.hibernate.jdbc.batch_size=1000
# 여러 엔티티의 INSERT가 섞이면 배치가 끊기므로 엔티티별로 모아서 실행
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
# PostgreSQL 드라이버가 배치로 묶인 INSERT를 VALUES (...), (...) 한 문장으로 다시 써서 전송
spring.datasource.hikari.data-source-properties.reWriteBatchedInserts=true


# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.access.expiration=3600000
jwt.refresh.expiration=604800000

# CORS Configuration
auth.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:3000,https://j14a505.p.ssafy.io:8443,https://j14a505.p.ssafy.io}

# Prometheus Configuration
management.endpoints.web.exposure.include=prometheus
management.endpoints.prometheus.enabled=true

# DB configuration
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# AI Server Configuration
ai.server.base-url=${AI_SERVICE_URL:${AI_SERVER_URL:http://ai:8000}}
ai.server.connect-timeout=5000
ai.server.read-timeout=60000
ai.server.internal-api-key=${AI_INTERNAL_API_KEY:dev-secret-key}
